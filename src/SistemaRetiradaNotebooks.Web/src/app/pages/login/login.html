<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <span class="login-icon">💻</span>
      <h1>Retirada de Notebooks</h1>
    </div>
    <h2>Entrar no sistema</h2>

    @if (erro) {
      <div class="alert-error">{{ erro }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="entrar()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input id="senha" type="password" formControlName="senha" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" [disabled]="form.invalid || carregando" (click)="entrar()">
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="login-footer">
      Não tem conta? <a routerLink="/cadastro">Solicitar cadastro</a>
    </p>
  </div>
</div>
