<div class="cadastro-wrapper">
  <div class="cadastro-card">
    <div class="cadastro-header">
      <span>💻</span>
      <h1>Retirada de Notebooks</h1>
    </div>
    <h2>Solicitar cadastro</h2>

    @if (sucesso) {
      <div class="alert-success">
        <strong>Cadastro enviado!</strong><br>
        Aguarde a aprovação do administrador para acessar o sistema.
      </div>
      <a routerLink="/login" class="btn-voltar">Voltar para o login</a>
    } @else {
      @if (erro) {
        <div class="alert-error">{{ erro }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="cadastrar()">
        <div class="form-group">
          <label>Nome completo</label>
          <input type="text" formControlName="nome" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" formControlName="senha" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="btn-cadastrar" [disabled]="form.invalid || carregando">
          {{ carregando ? 'Enviando...' : 'Solicitar cadastro' }}
        </button>
      </form>

      <p class="cadastro-footer">
        Já tem conta? <a routerLink="/login">Entrar</a>
      </p>
    }
  </div>
</div>
