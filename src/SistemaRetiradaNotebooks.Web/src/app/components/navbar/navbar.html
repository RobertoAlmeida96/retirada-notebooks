<nav class="navbar">
  <div class="navbar-brand">
    <span class="brand-icon">💻</span>
    <span>Retirada de Notebooks</span>
  </div>

  <div class="navbar-links">
    <a routerLink="/notebooks" routerLinkActive="active">Notebooks</a>
    <a routerLink="/solicitacoes" routerLinkActive="active">Solicitações</a>
    @if (isAdmin) {
      <a routerLink="/admin" routerLinkActive="active">Administração</a>
    }
  </div>

  <div class="navbar-user">
    <span class="user-name">{{ usuario?.nome }}</span>

      <span class="badge-admin">Admin</span>
    }

  </div>
</nav>
